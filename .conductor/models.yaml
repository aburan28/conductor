# Model aliases and capability policy.
#
# Policies reference roles, never concrete model names, so the catalog can change without
# editing WORKFLOW.md or any task. Aliases resolve against the model_profiles catalog at
# attempt start, and the resolution is recorded on the attempt.

models:
  defaultAlias: worker.general

  aliases:
    worker.public-free:
      capability_floor: [code_edit, tests]
      default_effort: low
      tier: T1
    planner.frontier:
      capability_floor: [architecture, long_context, strong_tool_use]
      default_effort: high
      tier: T3
    worker.fast:
      capability_floor: [code_edit, tests]
      default_effort: low
      tier: T1
    worker.general:
      capability_floor: [code_edit, tests, multi_file]
      default_effort: medium
      tier: T2
    verifier.cheap:
      capability_floor: [read_diff, test_analysis]
      default_effort: low
      tier: T1
    reviewer.strong:
      capability_floor: [code_review, architecture]
      default_effort: high
      tier: T3

  # Ordered cheapest -> most capable. Escalation walks up this ladder; de-escalation walks
  # down it. A task's capability or security floor is never crossed by either direction.
  ladder: [worker.fast, worker.general, planner.frontier]

# Concrete profiles. Cost figures are USD per million tokens and should be refreshed from a
# model catalog rather than trusted indefinitely. Subscription-based harnesses expose
# capacity rather than per-token cost; those are marked `billing: capacity`.
#
# A profile names a model either outright (`model: …`) or by what it wants (`select: …`).
# With `select`, Conductor asks the named inference endpoint which models it serves
# (`conductor models endpoints add anthropic`) and follows the newest one that matches, so a
# provider's next release is adopted without editing this file. `model` beside `select` is
# the fallback used until the endpoint has been listed, or if it serves nothing that matches.
#   select:
#     endpoint: anthropic          # a name from `conductor models endpoints`
#     match: ["claude-sonnet-*"]   # globs; `*` crosses `/` so "vendor/model" ids work
#     exclude: ["*-preview"]       # optional
#     prefix: "vllm/"              # optional: prepended, for harnesses that namespace models
profiles:
  # Isolated OpenCode probe on 2026-10-17 returned text and wrote a file through
  # a tool call. This alias is outside the default ladder: only the dispatch
  # rule with public-free-ok selects it automatically. Free-tier availability
  # and rate limits can change; re-probe before relying on it.
  - alias: worker.public-free
    harness: opencode
    provider: openrouter
    model: openrouter/poolside/laguna-xs-2.1:free
    reasoning_effort: low
    capabilities: [code_edit, tests, read_diff]
    tier: T1
    billing: tokens
    input_cost_per_mtok: 0
    output_cost_per_mtok: 0

  - alias: planner.frontier
    harness: claude
    provider: anthropic
    model: claude-opus-5
    select: {endpoint: anthropic, match: ["claude-opus-*"]}
    reasoning_effort: high
    capabilities: [architecture, long_context, strong_tool_use, code_edit, code_review]
    billing: tokens

  - alias: worker.general
    harness: claude
    provider: anthropic
    model: claude-sonnet-5
    select: {endpoint: anthropic, match: ["claude-sonnet-*"]}
    reasoning_effort: medium
    capabilities: [code_edit, tests, multi_file, read_diff]
    billing: tokens

  - alias: worker.fast
    harness: claude
    provider: anthropic
    model: claude-haiku-4-5-20251001
    select: {endpoint: anthropic, match: ["claude-haiku-*"]}
    reasoning_effort: low
    capabilities: [code_edit, tests, read_diff]
    billing: tokens

  - alias: verifier.cheap
    harness: claude
    provider: anthropic
    model: claude-haiku-4-5-20251001
    select: {endpoint: anthropic, match: ["claude-haiku-*"]}
    reasoning_effort: low
    capabilities: [read_diff, test_analysis]
    billing: tokens

  - alias: reviewer.strong
    harness: claude
    provider: anthropic
    model: claude-opus-5
    select: {endpoint: anthropic, match: ["claude-opus-*"]}
    reasoning_effort: high
    capabilities: [code_review, architecture, long_context]
    billing: tokens

  # gpt-5.3-codex is OpenAI's current Codex-tuned model id (developers.openai.com/api/docs/
  # models/gpt-5.3-codex, checked 2026-10-05). The profile stays disabled until someone on
  # this installation has run `codex exec -m gpt-5.3-codex` against their account.
  # OpenCode talks to local vLLM (`conductor serve`). Model ids match --served-model-name.
  - alias: worker.general
    harness: codex
    provider: openai
    model: gpt-5.3-codex
    reasoning_effort: medium
    capabilities: [code_edit, tests, multi_file]
    enabled: false

  - alias: worker.fast
    harness: opencode
    provider: vllm
    model: vllm/qwen3.8-27b
    reasoning_effort: low
    capabilities: [code_edit, tests, read_diff, strong_tool_use]
    tier: T1
    context_window: 32768
    billing: capacity

  - alias: worker.general
    harness: opencode
    provider: vllm
    model: vllm/zai-org/GLM-5.3-Flash
    reasoning_effort: medium
    capabilities: [code_edit, tests, multi_file, read_diff, strong_tool_use]
    tier: T2
    context_window: 32768
    billing: capacity

  - alias: planner.frontier
    harness: opencode
    provider: vllm
    model: vllm/glm-5.3
    reasoning_effort: high
    capabilities: [architecture, long_context, strong_tool_use, code_edit, code_review]
    tier: T3
    context_window: 32768
    billing: capacity
