# Dispatch policy: send implementation work to models by rule.
#
# Lanes are named execution paths, each an ordered ladder of candidate models. The first
# eligible candidate wins; escalation (on failure) walks down the ladder. Rules pick the lane
# and add floors or preferences for tasks matching a 'when' expression. Everything is
# deterministic: a rule can raise a floor or prefer a model, never route around a hard floor
# the security rules in policies.yaml set.
#
# Facts a 'when' expression can read include: task.labels, task.paths, task.risk,
# task.estimated_files, task.security_sensitive, task.schema_or_migration, attempt.failures,
# budget.fraction, and more — run 'conductor policy lint' to catch typos.

version: 1

lanes:
  implement:
    role: implementer
    candidates:
      # A local model for small, low-risk work — cheap and private. Declare it in models.yaml
      # with a tier so tier floors can still be met. Requires OpenCode + Ollama installed.
      # - model: ollama/qwen3:27b
      #   harness: opencode
      #   tags: [local, cheap]
      #   when: task.estimated_files <= 3 && !task.security_sensitive
      #   max_concurrent: 1
      - model: claude-sonnet-5
        harness: claude
        effort: medium
      - model: claude-opus-5
        harness: claude
        effort: high

  review:
    role: reviewer
    review: required
    candidates:
      - alias: reviewer.strong

  # Candidate search against a cairn objective. See docs/cairn-integration.md.
  #
  # cairn owns no compute loop: its agent loop is
  # `list_objectives -> get_objective -> generate -> score_candidate xN -> submit_claim`,
  # and `generate` is the step with no cairn code behind it. This lane is that step.
  #
  # Search is a volume game against a free fitness function -- `score_candidate` runs the
  # objective's pinned verifier, records nothing, and costs nothing -- so the cheap local
  # model does the bulk of it and the ladder is walked only when attempts actually fail.
  # Escalating on a *low score* would be wrong: a low score is the search working.
  #
  # INERT until a `cairn` harness is registered. `harness.BuildRegistry` has the exec-driver
  # branch for it, but both callers pass the hardcoded `DefaultHarnessConfigs()`, so there is
  # no YAML path to declare one yet -- docs/cairn-integration.md section 4.1.
  cairn-search:
    role: implementer
    candidates:
      - model: vllm/qwen3.8-27b
        harness: cairn
        tags: [local, cheap]
        # One GPU, one attempt. Without this the lane will happily start four.
        max_concurrent: 1
      - model: claude-sonnet-5
        harness: cairn
        effort: medium
      - model: claude-opus-5
        harness: cairn
        effort: high

rules:
  # Documentation and comment-only work can go to the cheapest local candidate.
  - id: docs-local
    when: task.labels has "docs"
    prefer: { tag: local }

  # Anything touching the model catalog itself gets the frontier model.
  - id: routing-changes
    when: task.paths any "internal/router/**"
    require: { tier: T3 }

  # A task carrying the cairn objective id in external_ref is search, not repo work.
  - id: cairn-objectives
    when: task.labels has "cairn"
    lane: cairn-search
    prefer: { tag: local }

  # Reward-aware routing: these read cairn ledger facts -- deterministic, re-derivable by
  # anyone holding the log, provable by `cairn audit` -- so model spend follows verified
  # return rather than a guess. See docs/cairn-integration.md section 4.3.
  #
  # Absent cairn facts render as null, and no threshold against null is ever true, so neither
  # rule can fire on an ordinary repository task. `cairn.known &&` is therefore belt and
  # braces, kept because it says out loud what the rule is about.
  #
  # An objective whose pool is spent still gets worked -- a result is worth having even when
  # it pays nothing -- but at the cheapest model on the ladder.
  - id: cairn-exhausted-goes-cheap
    when: cairn.known && cairn.reward_remaining <= 0
    prefer: { tag: local }

  # A large pool still on the table justifies the frontier model.
  - id: cairn-well-funded-escalate
    when: cairn.known && !cairn.settled && cairn.reward_remaining >= 1000000
    require: { tier: T3 }

  # Bound-beating work: the same shape, read from measured-bound documents instead of a cairn
  # ledger -- a frontier of method costs and the verdicts of challenges against it, both
  # sealed and re-derivable from the records by anyone (docs/bounds-integration.md). A task
  # carries the challenge id (ECCH1h...) in external_ref and the label "bounds".
  #
  # A challenge that has gone three epochs without an advance has shown what the cheap end of
  # the ladder finds; the next epoch gets the frontier model. The guard is belt and braces as
  # with cairn: an absent challenge fact is null and satisfies no threshold, so a task that
  # names no challenge, or one nobody has run yet, never looks stalled.
  - id: bounds-stalled-escalate
    when: bounds.challenge_known && bounds.epochs_without_advance >= 3
    require: { tier: T3 }

  # Bounds work with no frontier to read is held at the cheap end of the ladder: without the
  # document, "beat this bound" has no bound in it, and a frontier model would be spent
  # proving nothing. Here the label guard is load-bearing, not decoration -- bounds.known is a
  # fact about the project's configuration, false for every task when no frontier is
  # configured, so without the guard this rule would prefer local on everything. Dispatch
  # has no verb to refuse work and should not: a missing document is a configuration gap,
  # never evidence about the bound.
  - id: bounds-unknown-frontier-hold
    when: task.labels has "bounds" && !bounds.known
    prefer: { tag: local }

defaults:
  lane: implement
  on_failure: escalate    # escalate | retry | stop
  max_escalations: 2

# Cap concurrent attempts on a model across the whole project — a single-GPU local model,
# a rate-limited API key. 0 or omitted means unlimited.
limits:
  # - match: { harness: opencode }
  #   max_concurrent: 1
