# staticcheck configuration (CI runs staticcheck on every push; see .github/workflows/ci.yml).
#
# ST1005 (error strings start lower-case, no trailing punctuation) is off: several errors
# here are user-facing guidance that begins with a proper noun ("Postgres did not become
# ready") or spans paragraphs (conductord's refusal to serve tokens without TLS).
#
# SA4000 (identical expressions on both sides of an operator) is off because the privacy
# tests compare a function's result with a second call of the same function on purpose, to
# prove it is deterministic. Re-enable it once those tests carry //lint:ignore directives;
# internal/privacy is a protected scope, so that edit belongs to its owner.
checks = ["inherit", "-ST1005", "-SA4000"]
