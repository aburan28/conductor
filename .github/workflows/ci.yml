name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Every job only reads the repository. Anything that needs more asks for it per job.
permissions:
  contents: read

# Cancel superseded PR checks without interrupting protected-branch validation.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot), with the
# version in a comment so Dependabot can propose upgrades.

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.scope.outputs.go }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge-base and merge-group diffs need both sides, including base history.
          fetch-depth: 0
      - name: validate scope detection and CI scripts
        run: |
          python3 scripts/test-ci-scope.py
          bash -n scripts/ci-local.sh scripts/e2e.sh
      - name: select relevant checks
        id: scope
        run: python3 scripts/ci-scope.py

  # These names remain unchanged for existing branch protections. A scope failure runs
  # all checks rather than silently making an existing required check pass by skipping it.
  lint:
    name: lint
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Every check below is a step of scripts/ci-local.sh, the same script `make check` and
      # `make ci` run before a push, so what passes locally is what CI runs. The pinned tool
      # versions (staticcheck, govulncheck) live there too.
      - name: gofmt
        run: ./scripts/ci-local.sh gofmt

      - name: go vet
        run: ./scripts/ci-local.sh vet

      - name: staticcheck
        run: ./scripts/ci-local.sh staticcheck

  govulncheck:
    name: govulncheck
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Scans with the toolchain go.mod selects, so standard-library fixes count only once
      # go.mod actually requires them; the vulnerability database is always current.
      - name: govulncheck
        run: ./scripts/ci-local.sh govulncheck

  test:
    # Literal names preserve required contexts even when a job is skipped before its
    # matrix expands. Each singleton matrix supplies the service version to shared steps.
    name: test (Postgres 16)
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16"]

    # The integration tests need a real Postgres: SKIP LOCKED, advisory locks, and partial
    # unique indexes are load-bearing, so there is nothing meaningful to test against a
    # substitute.
    services: &postgres-services
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor -d conductor"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env: &postgres-environment
      DATABASE_URL: postgres://conductor:conductor@localhost:5432/conductor?sslmode=disable
      # ci-local.sh uses this database instead of starting a throwaway one.
      CI_DATABASE_URL: postgres://conductor:conductor@localhost:5432/conductor?sslmode=disable

    steps: &postgres-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # One invocation shares the database probe; both supported Postgres versions retain
      # the ordinary suite, race detector and end-to-end coverage.
      - name: build, test, race and end-to-end
        run: ./scripts/ci-local.sh build test race e2e

      - name: server logs on failure
        if: failure()
        run: |
          for f in /tmp/conductor-e2e.*/conductord.log; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done || true

  test17:
    name: test (Postgres 17)
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        # docker-compose.yml and `conductor up` use this version.
        postgres: ["17"]
    services: *postgres-services
    env: *postgres-environment
    steps: *postgres-steps

  # The release ships darwin binaries, so they are built and unit-tested on macOS. There is no
  # Postgres service on macOS runners; the integration tests skip themselves without
  # DATABASE_URL, which is acceptable here and only here: the Linux jobs run them for real.
  macos:
    name: build and unit test (macOS)
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: ./scripts/ci-local.sh build

      - name: test
        run: ./scripts/ci-local.sh unit

  site:
    name: build site (PR)
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install and build site
        working-directory: site
        run: |
          npm ci
          npm run build

  gate:
    name: CI gate
    needs: [changes, lint, govulncheck, test, test17, macos, site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require relevant checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              sys.exit('CI scope validation failed')
          for scope in ['go', 'site']:
              if results['changes']['outputs'].get(scope) not in ['true', 'false']:
                  sys.exit(f'Missing or invalid {scope} scope output')
          for job in ['lint', 'govulncheck', 'test', 'test17', 'macos', 'site']:
              scope = 'site' if job == 'site' else 'go'
              expected = 'success' if results['changes']['outputs'].get(scope) == 'true' else 'skipped'
              actual = results[job]['result']
              if actual != expected:
                  sys.exit(f'{job}: expected {expected}, got {actual}')
          PY
