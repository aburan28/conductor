name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository. Anything that needs more asks for it per job.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it. The Postgres-backed suite is the slow
# part and there is no value in finishing a run for a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved; a SHA cannot), with the
# version in a comment so Dependabot can propose upgrades.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Every check below is a step of scripts/ci-local.sh, the same script `make check` and
      # `make ci` run before a push, so what passes locally is what CI runs. The pinned tool
      # versions (staticcheck, govulncheck) live there too.
      - name: gofmt
        run: ./scripts/ci-local.sh gofmt

      - name: go vet
        run: ./scripts/ci-local.sh vet

      - name: staticcheck
        run: ./scripts/ci-local.sh staticcheck

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Scans with the toolchain go.mod selects, so standard-library fixes count only once
      # go.mod actually requires them; the vulnerability database is always current.
      - name: govulncheck
        run: ./scripts/ci-local.sh govulncheck

  test:
    name: test (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one docker-compose.yml and `conductor up` run.
        postgres: ["16", "17"]

    # The integration tests need a real Postgres: SKIP LOCKED, advisory locks, and partial
    # unique indexes are load-bearing, so there is nothing meaningful to test against a
    # substitute.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor -d conductor"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://conductor:conductor@localhost:5432/conductor?sslmode=disable
      # ci-local.sh uses this database instead of starting a throwaway one.
      CI_DATABASE_URL: postgres://conductor:conductor@localhost:5432/conductor?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, so make build stamps a real `git describe` version.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: ./scripts/ci-local.sh build

      # Each database step first proves the integration tests reach Postgres rather than
      # skipping, which would turn a misconfigured service container into a silently green run.
      - name: test
        run: ./scripts/ci-local.sh test

      - name: test with the race detector
        run: ./scripts/ci-local.sh race

      - name: end-to-end
        run: ./scripts/ci-local.sh e2e

      - name: server logs on failure
        if: failure()
        run: |
          for f in /tmp/conductor-e2e.*/conductord.log; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done || true

  # The release ships darwin binaries, so they are built and unit-tested on macOS. There is no
  # Postgres service on macOS runners; the integration tests skip themselves without
  # DATABASE_URL, which is acceptable here and only here: the Linux jobs run them for real.
  macos:
    name: build and unit test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: ./scripts/ci-local.sh build

      - name: test
        run: ./scripts/ci-local.sh unit
