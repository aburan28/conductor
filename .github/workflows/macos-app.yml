name: macOS app

# Conductor.app (macos/, docs/MACOS_APP.md). Two jobs: ConductorKit, where all the logic is,
# built and tested on Linux in the Swift container; and the app itself built on a Mac,
# tested, assembled by macos/build.sh (unsigned: no signing secrets are configured yet), run
# against its own bundled Postgres and conductord, and uploaded as ZIP and DMG artifacts.
# The release workflow calls this same build with the release tag as its version.

on:
  pull_request:
    paths:
      - "macos/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
  # Pushes to main only: a pull request's branch is already built by the pull_request event,
  # and a second macOS run per push holds one of the account's few concurrent macOS runners.
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag to check out and stamp into the app and bundled commands
        required: true
        type: string

permissions:
  contents: read

# A release build is grouped by its version, not the caller's ref: a backfill dispatched from
# main must not share a group with (and be cancelled by) the CI run of the next push to main.
concurrency:
  group: macos-app-${{ inputs.version || github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, as in ci.yml, with the version in a comment.

jobs:
  kit-linux:
    name: ConductorKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false

      - name: swift build
        working-directory: macos
        run: swift build

      - name: swift test
        working-directory: macos
        run: swift test

      - name: packaging scripts
        run: macos/packaging/test-signing.sh

  app-macos:
    name: Conductor.app (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ inputs.version || '0.0.0' }}
      BUILD_VERSION: ${{ inputs.version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
          persist-credentials: false
          # build.sh stamps `git describe` into the Go commands.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries must not use a module/build cache populated by a PR.
          cache: ${{ inputs.version == '' }}

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: swift build
        working-directory: macos
        run: swift build

      - name: swift test
        working-directory: macos
        run: swift test

      # The PostgreSQL bundle is 437 MB to download; the cut-down result is cached, keyed on
      # the script that pins its URL and hash.
      - name: Cache the PostgreSQL bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/build/postgres
          key: postgres-${{ hashFiles('macos/fetch-postgres.sh') }}

      # Local/PR artifacts may be unsigned. The release caller always supplies version, and a
      # public release is unsigned only because this workflow says so: no Developer ID
      # certificate or notarization credentials are configured yet, so releases ship the
      # unsigned DMG (its README says how to open it). Partial signing is still refused.
      # Once the signing secrets are wired into the build, delete CONDUCTOR_ALLOW_UNSIGNED_RELEASE
      # so an unsigned public release is refused again.
      - name: Release signing policy
        if: inputs.version != ''
        env:
          CONDUCTOR_ALLOW_UNSIGNED_RELEASE: "1"
        run: |
          . macos/packaging/signing.sh
          require_release_signing

      - name: Build Conductor.app (universal)
        run: macos/build.sh --version "$APP_VERSION"

      - name: Check the bundle
        run: |
          APP=macos/build/Conductor.app
          plutil -lint "$APP/Contents/Info.plist"
          for f in "$APP/Contents/MacOS/Conductor" "$APP"/Contents/Resources/bin/* "$APP/Contents/Resources/postgres/bin/postgres"; do
            echo "$f: $(lipo -archs "$f")"
            lipo -archs "$f" | grep -q arm64
            lipo -archs "$f" | grep -q x86_64
          done
          "$APP/Contents/Resources/bin/conductor" version
          "$APP/Contents/Resources/postgres/bin/postgres" --version
          codesign --verify --strict --deep "$APP"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"

      - name: Zip the app
        run: ditto -c -k --keepParent macos/build/Conductor.app Conductor.app.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Conductor.app
          path: Conductor.app.zip
          retention-days: 14
          if-no-files-found: error

      - name: Build and verify the DMG (universal)
        run: |
          set -euo pipefail
          macos/packaging/build-dmg.sh --app macos/build/Conductor.app --version "$APP_VERSION" --out dist
          hdiutil verify "dist/Conductor-${APP_VERSION#v}-macos-universal.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Conductor.dmg
          path: dist/Conductor-*-macos-universal.dmg
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      # The app's own Postgres and conductord, out of the built bundle, without launchd:
      # initdb with the supervisor's arguments, the socket-only configuration, conductord on
      # the socket DSN, bootstrap, local sign-in, the event stream, and an invite link that
      # `conductor join` accepts (Tests/ConductorKitTests/IntegrationTests.swift).
      # The step-level timeout: green runs finish in well under a minute, and a hung run
      # should fail fast and be retried, not hold one of the account's few macOS runners for
      # the job's full hour. Hangs are intermittent but not rare (v0.1.3 and v0.1.5 hung on
      # both attempts), and `swift test` holds the test's output until it exits, so a killed
      # run printed nothing. The test also appends each step to CONDUCTOR_IT_LOG, which the
      # diagnostics step below prints with the Postgres and conductord logs.
      - name: Integration (bundled Postgres and conductord)
        working-directory: macos
        timeout-minutes: 10
        env:
          CONDUCTOR_IT_PG_BIN: ${{ github.workspace }}/macos/build/Conductor.app/Contents/Resources/postgres/bin
          CONDUCTOR_IT_BIN: ${{ github.workspace }}/macos/build/Conductor.app/Contents/Resources/bin
          CONDUCTOR_IT_LOG: ${{ runner.temp }}/integration-steps.log
        run: swift test --filter IntegrationTests
        # A hung run is environmental: retry once before declaring failure. The first attempt
        # continues on error, or its failure would fail the job even when the retry passes.
        id: integration
        continue-on-error: true
      - name: Integration retry (once)
        working-directory: macos
        timeout-minutes: 10
        if: steps.integration.outcome == 'failure'
        env:
          CONDUCTOR_IT_PG_BIN: ${{ github.workspace }}/macos/build/Conductor.app/Contents/Resources/postgres/bin
          CONDUCTOR_IT_BIN: ${{ github.workspace }}/macos/build/Conductor.app/Contents/Resources/bin
          CONDUCTOR_IT_LOG: ${{ runner.temp }}/integration-steps.log
        run: swift test --filter IntegrationTests

      # Where a failed or hung integration run got to: the last step it announced, what the
      # bundled Postgres and conductord logged, and what was still running. Printed whenever
      # the first attempt failed, so a hang the retry recovered from is still on record.
      - name: Integration diagnostics
        if: always() && steps.integration.outcome == 'failure'
        env:
          CONDUCTOR_IT_LOG: ${{ runner.temp }}/integration-steps.log
        run: |
          echo "::group::integration steps reached (every attempt)"
          cat "$CONDUCTOR_IT_LOG" 2>/dev/null || echo "(no step log: the test never started)"
          echo "::endgroup::"
          for f in /tmp/conductor-it-*/postgres.log /tmp/conductor-it-*/conductord.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (last 100 lines)"
            tail -n 100 "$f"
            echo "::endgroup::"
          done
          echo "::group::processes still running"
          pgrep -fl 'postgres|conductor|xctest|swift-' || true
          echo "::endgroup::"
