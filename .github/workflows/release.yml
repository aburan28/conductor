name: release

# A tagged release builds the binaries for every supported platform and the universal Mac
# DMG, and publishes them with SHA256SUMS and signed build-provenance attestations.
#
# Triggers:
# - tag push `v*`, or a `release` published, by a person (a manual cut)
# - `workflow_dispatch` at the tag: how release-please's releases get built. release-please
#   tags and publishes with GITHUB_TOKEN, and GitHub starts no workflow for anything that
#   token does — not the tag push, not the published release. workflow_dispatch is exempt,
#   so release-please.yml's start-release job dispatches this workflow at the new tag.
#   v0.1.2 shipped with no assets because nothing did.
# - `workflow_dispatch` from main with `tag`: backfill a release whose tag predates this
#   trigger. The tag's code is built either way; only this workflow file comes from main.
#
# The tag is `inputs.tag`, else the release's tag, else the ref this run started at.
#
# Asset names keep the tag's leading "v" (conductor_v1.2.3_linux_amd64.tar.gz), which is what
# scripts/install-release.sh downloads. Change both together or not at all.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (vX.Y.Z); empty when dispatched at the tag itself"
        required: false
        type: string

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ref the tag, so the build matches what is published however this run started.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release is built from a clean module cache, so nothing a PR run cached can end
          # up inside a published binary.
          cache: false

      - name: build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          # The checked-out tag's commit; github.sha is main's on a backfill dispatch.
          COMMIT="$(git rev-parse HEAD)"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $VERSION is not a semantic version (vX.Y.Z); refusing to release it" >&2
            exit 1
          fi
          module="$(go list -m)"
          ldflags="-s -w -X ${module}/internal/version.version=${VERSION} -X ${module}/internal/version.commit=${COMMIT}"
          name="conductor_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          for bin in conductord conductor conductor-mcp conductor-mesh-dns delphi; do
            go build -trimpath -ldflags "$ldflags" -o "dist/$name/$bin" "./cmd/$bin"
          done
          cp LICENSE NOTICE README.md "dist/$name/"
          # -C dist makes the archive hold "$name/…", which is the layout install-release.sh
          # unpacks. The archive path is relative to the working directory, not to dist.
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS release
    permissions:
      contents: read
    uses: ./.github/workflows/macos-app.yml
    with:
      version: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    secrets: inherit

  publish:
    needs: [build, macos]
    # Wait for all CLI archives and the tested Mac app and DMG before publishing assets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: conductor-macos-appcast
      cancel-in-progress: false
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the provenance attestation (Sigstore, via OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: collect platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{darwin,linux}-*'
          path: out
          merge-multiple: true

      - name: collect the Mac DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Conductor.dmg
          path: out

      - name: collect the signed update feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Conductor.appcast
          path: out

      - name: checksums
        working-directory: out
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l
          archives=(conductor_*.tar.gz)
          [ "${#archives[@]}" -eq 4 ] || { echo "expected 4 archives" >&2; exit 1; }
          dmg="Conductor-${TAG#v}-macos-universal.dmg"
          test -s "$dmg"
          test -s appcast.xml
          grep -Fq "<sparkle:version>${TAG#v}</sparkle:version>" appcast.xml
          grep -Fq "sparkle:installationType=\"package\"" appcast.xml
          sha256sum "${archives[@]}" "$dmg" appcast.xml > SHA256SUMS
          cat SHA256SUMS

      # Provenance binds each archive and DMG digest to this workflow, commit, and tag. Verify with:
      #   gh attestation verify conductor_vX.Y.Z_linux_amd64.tar.gz --repo OWNER/REPO
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        working-directory: out
        run: |
          set -euo pipefail
          dmg="Conductor-${TAG#v}-macos-universal.dmg"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Publish only a draft whose complete assets have passed validation. Never
            # replace assets someone may already have installed and verified.
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true ] || {
              echo "refusing to modify an already published release" >&2; exit 1;
            }
            existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if [ -n "$existing" ]; then
              echo "release $TAG already has assets:" >&2
              echo "$existing" >&2
              echo "refusing to replace them; cut a new tag instead" >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" conductor_*.tar.gz "$dmg" appcast.xml SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes "$(git log -1 --format=%B)" \
              conductor_*.tar.gz "$dmg" appcast.xml SHA256SUMS
          fi
          # Verify the uploaded bytes before making the release visible to installers.
          mkdir verified-upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified-upload
          cmp SHA256SUMS verified-upload/SHA256SUMS
          (cd verified-upload && sha256sum -c SHA256SUMS)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # The fixed prerelease is the URL in SUFeedURL. Serialize publishers above and only
      # advance it after the versioned DMG and appcast have been downloaded and verified.
      - name: advance the fixed Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        working-directory: out
        run: |
          set -euo pipefail
          case "$TAG" in *-*) echo "prerelease $TAG leaves the stable feed unchanged"; exit 0;; esac
          fixed=macos-appcast
          repo="$GITHUB_REPOSITORY"
          if ! gh release view "$fixed" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$fixed" --repo "$repo" --target "$(git rev-parse HEAD)" \
              --prerelease --latest=false --title 'Conductor update feed' \
              --notes 'Sparkle reads appcast.xml here. The release workflow updates it after verifying each signed macOS release.'
          fi
          current=''
          mkdir -p current-feed
          if gh release download "$fixed" --repo "$repo" --pattern appcast.xml --dir current-feed 2>/dev/null; then
            current="$(sed -n 's/.*<sparkle:version>\([^<]*\)<.*/\1/p' current-feed/appcast.xml | head -n 1)"
            [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo 'existing fixed feed has no valid version; refusing to replace it' >&2; exit 1;
            }
          fi
          newest="$(printf '%s\n%s\n' "${current:-0.0.0}" "${TAG#v}" | sort -V | tail -n 1)"
          if [ -n "$current" ] && [ "$newest" != "${TAG#v}" ]; then
            echo "fixed feed already names newer version $current; leaving it"
            exit 0
          fi
          gh release upload "$fixed" appcast.xml --clobber --repo "$repo"

